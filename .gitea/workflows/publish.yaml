# One pipeline for packaging, two modes:
# - vX.Y.Z tags: test, then build and push the container image (tagged with the version and
#   "latest") and the Helm chart (at that version) to Gitea, and to GHCR when configured.
# - Pull requests: the same image and chart builds, without logins or pushes, so a broken
#   Dockerfile, chart or publish-only action bump (e.g. a Renovate PR) fails the PR instead of
#   the next release. Tests are skipped there - build.yaml already runs them on every PR.
# Every login/push step is gated on needs.prerequisites.outputs.release.
#
# No paths filter on purpose: as required checks in branch protection, skipped PR runs would
# leave PRs that don't touch the Dockerfile or chart stuck waiting for them.
#
# Required repo secrets beyond the existing GITEA_TOKEN (checkout):
#   T5S_PACKAGE_TOKEN  - Gitea access token with package:write, for docker/helm login
#   GHCR_USERNAME      - GitHub username/org to push under
#   GHCR_TOKEN         - GitHub PAT with write:packages
name: Package & Publish
on:
  pull_request:
  push:
    tags: ["v*.*.*"]

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    # Same Postgres service as build.yaml - the PostgresStorage tests fail rather than skip in CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
    env:
      BADGEBUTLER_TEST_POSTGRES: Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - name: Determine version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "version=0.0.0-pr" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout
        if: steps.version.outputs.release == 'true'
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Setup .NET
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-dotnet@v6
      - name: Restore
        if: steps.version.outputs.release == 'true'
        run: dotnet restore BadgeButler.slnx
      - name: Wait for Postgres
        if: steps.version.outputs.release == 'true'
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 2
          done
          echo "Postgres service did not come up within 60s" >&2
          exit 1
      - name: Test
        if: steps.version.outputs.release == 'true'
        run: dotnet test BadgeButler.slnx --no-restore -c Release

  docker-image:
    needs: prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Compute image tags
        id: tags
        if: needs.prerequisites.outputs.release == 'true'
        run: |
          VERSION="${{ needs.prerequisites.outputs.version }}"
          {
            echo "gitea_tags<<TAGEOF"
            echo "gitea.team5software.de/t5s/badge-butler:${VERSION}"
            echo "gitea.team5software.de/t5s/badge-butler:latest"
            echo "TAGEOF"

            echo "ghcr_tags<<TAGEOF"
            echo "ghcr.io/${{ secrets.GHCR_USERNAME }}/badge-butler:${VERSION}"
            echo "ghcr.io/${{ secrets.GHCR_USERNAME }}/badge-butler:latest"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        if: needs.prerequisites.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: gitea.team5software.de
          username: ${{ gitea.actor }}
          password: ${{ secrets.T5S_PACKAGE_TOKEN }}

      # On PRs this is the build-only check: no tags, no push.
      - name: Build (and push to Gitea on release)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BadgeButler.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prerequisites.outputs.release == 'true' }}
          provenance: false
          tags: ${{ steps.tags.outputs.gitea_tags }}
          annotations: |
            index:org.opencontainers.image.source=https://gitea.team5software.de/t5s/badge-butler
            index:org.opencontainers.image.description=Stores and serves status badges
            index:org.opencontainers.image.licenses=MIT

      - name: Log in to GHCR (optional)
        id: ghcr_login
        if: needs.prerequisites.outputs.release == 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push to GHCR
        if: steps.ghcr_login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BadgeButler.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/team5software/badge-butler
            index:org.opencontainers.image.description=Stores and serves status badges
            index:org.opencontainers.image.licenses=MIT

      - name: Warn if GHCR login failed
        if: steps.ghcr_login.outcome == 'failure'
        run: |
          {
            echo "### :warning: Could not connect to GHCR (docker-image)"
            echo "Pushing to ghcr.io is optional and this can be intended. If you want to push to ghcr.io, please check your credentials."
          } >> "$GITHUB_STEP_SUMMARY"

  helm-chart:
    needs: [ prerequisites, docker-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/badge-butler

      # On PRs the version is 0.0.0-pr, only so the package step has something valid to stamp.
      - name: Set chart/app version
        env:
          VERSION: ${{ needs.prerequisites.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" charts/badge-butler/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/badge-butler/Chart.yaml

      - name: Package chart
        run: helm package charts/badge-butler --destination .

      - name: Log in to Gitea registry
        if: needs.prerequisites.outputs.release == 'true'
        run: helm registry login gitea.team5software.de -u "${{ gitea.actor }}" -p "${{ secrets.T5S_PACKAGE_TOKEN }}"

      - name: Push chart to Gitea
        if: needs.prerequisites.outputs.release == 'true'
        run: helm push "badge-butler-${{ needs.prerequisites.outputs.version }}.tgz" oci://gitea.team5software.de/t5s/charts

      - name: Log in to GHCR (optional)
        id: ghcr_login
        if: needs.prerequisites.outputs.release == 'true'
        continue-on-error: true
        run: helm registry login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" -p "${{ secrets.GHCR_TOKEN }}"

      - name: Re-point chart source to GitHub mirror for GHCR
        if: steps.ghcr_login.outcome == 'success'
        run: |
          sed -i "s|^home: .*|home: https://github.com/team5software/badge-butler|" charts/badge-butler/Chart.yaml
          sed -i "s|^  - https://gitea.team5software.de/t5s/badge-butler|  - https://github.com/team5software/badge-butler|" charts/badge-butler/Chart.yaml
          helm package charts/badge-butler --destination .

      - name: Push chart to GHCR
        if: steps.ghcr_login.outcome == 'success'
        run: helm push "badge-butler-${{ needs.prerequisites.outputs.version }}.tgz" "oci://ghcr.io/${{ secrets.GHCR_USERNAME }}/charts"

      - name: Warn if GHCR login failed
        if: steps.ghcr_login.outcome == 'failure'
        run: |
          {
            echo "### :warning: Could not connect to GHCR (helm-chart)"
            echo "Pushing to ghcr.io is optional and this can be intended. If you want to push to ghcr.io, please check your credentials."
          } >> "$GITHUB_STEP_SUMMARY"

  finish-line:
    needs: [ prerequisites, docker-image, helm-chart ]
    if: needs.prerequisites.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update release badge
        id: badge_update
        continue-on-error: true
        run: |
          curl -sf -X PUT https://badges.team5software.de/badges/badge-butler-release \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.BADGE_BUTLER_API_KEY }}" \
            -H "X-Badge-Key: ${{ secrets.BADGE_BUTLER_BADGE_KEY }}" \
            -d "{\"label\":\"release\",\"message\":\"v${{ needs.prerequisites.outputs.version }}\",\"color\":\"blue\"}"

      - name: Warn if badge update failed
        if: steps.badge_update.outcome == 'failure'
        run: |
          {
            echo "### :warning: Could not update badges"
          } >> "$GITHUB_STEP_SUMMARY"
