# Publishes the container image (and, on real releases, the Helm chart) to both registries.
# Two build kinds, one workflow:
#   - tag push "vX.Y.Z"     -> image tags "X.Y.Z" + "stable", chart packaged/pushed at that version
#   - push to "develop"     -> image tags "latest" + "unstable" (continuous, unstable-by-definition)
#
# Gitea's own registry is the required destination — that's what hl-apps/Flux actually pulls
# from. GHCR is best-effort: its login/push steps use continue-on-error so a GHCR outage or bad
# credentials never fails the run, but a warning is written to the job summary when it happens.
#
# Assumptions worth verifying against your actual instance/runner (can't be checked from here):
#   - the act_runner's DinD sidecar allows buildx + binfmt/QEMU registration (privileged, see
#     hl-apps apps/homelab/gitea/act-runner.yaml)
#   - GITHUB_ENV/GITHUB_OUTPUT/GITHUB_STEP_SUMMARY are the right special-file names here (Gitea
#     Actions keeps these GitHub-named for compatibility with unmodified marketplace actions;
#     only the `${{ gitea.* }}` context itself is renamed from `github.*`)
#
# Required repo secrets beyond the existing GITEA_TOKEN (checkout):
#   T5S_PACKAGE_TOKEN  - Gitea access token with package:write, for docker/helm login
#   GHCR_USERNAME      - GitHub username/org to push under (e.g. "t5s")
#   GHCR_TOKEN         - GitHub PAT with write:packages
name: Publish
on:
  push:
    tags: ["v*.*.*"]
    branches: ["develop"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      is_release: ${{ steps.tags.outputs.is_release }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Determine build kind and tags
        id: tags
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              KIND=release; VERSION="${GITHUB_REF_NAME#v}"; SUFFIXES="$VERSION stable"; REF="$GITHUB_REF_NAME" ;;
            *)
              KIND=develop; SUFFIXES="latest unstable"; REF="develop"; VERSION="" ;;
          esac

          {
            echo "ref=${REF}"
            echo "version=${VERSION}"
            echo "is_release=$([ "$KIND" = release ] && echo true || echo false)"

            echo "gitea_tags<<TAGEOF"
            for s in $SUFFIXES; do echo "gitea.team5software.de/t5s/badge-butler:${s}"; done
            echo "TAGEOF"

            echo "ghcr_tags<<TAGEOF"
            for s in $SUFFIXES; do echo "ghcr.io/${{ secrets.GHCR_USERNAME }}/badge-butler:${s}"; done
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          ref: ${{ steps.tags.outputs.ref }}

      # Self-contained gate: build.yaml already runs the full test+coverage pipeline, but that's
      # a separate workflow with no ordering guarantee against this one, so a failing suite
      # wouldn't otherwise stop an image from getting pushed. No continue-on-error - this must
      # block the build/push steps below.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore BadgeButler.slnx

      # No test project exists yet (empty test/ folder in the .slnx), and `dotnet test` exits
      # non-zero for "no test projects found" same as it would for an actual failure - only
      # treat that specific, textual case as a pass so real failures still block the pipeline.
      - name: Test
        run: |
          set +e
          output=$(dotnet test BadgeButler.slnx --no-restore -c Release 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "No test projects were found"; then
            echo "No test projects yet - nothing to gate on."
            exit 0
          fi
          exit $exit_code

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.team5software.de
          username: ${{ gitea.actor }}
          password: ${{ secrets.T5S_PACKAGE_TOKEN }}

      - name: Build and push to Gitea (required)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BadgeButler.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.gitea_tags }}

      - name: Log in to GHCR (best-effort)
        id: ghcr_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push to GHCR (best-effort)
        id: ghcr_push
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BadgeButler.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.ghcr_tags }}

      - name: Warn if GHCR push failed
        if: steps.ghcr_login.outcome == 'failure' || steps.ghcr_push.outcome == 'failure'
        run: |
          {
            echo "### :warning: GHCR image push failed"
            echo "Gitea registry push succeeded; ghcr.io did not (see the failed step above). Pipeline still passes since Gitea is the required destination."
          } >> "$GITHUB_STEP_SUMMARY"

  # Chart releases stay tied to real semver tags only - Helm's `version:` field must be valid
  # SemVer, which "nightly"/"unstable" aren't, and the chart rarely changes as often as the app.
  chart:
    runs-on: ubuntu-latest
    needs: image
    if: needs.image.outputs.is_release == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set chart/app version from tag
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" charts/badge-butler/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/badge-butler/Chart.yaml

      - name: Package chart
        run: helm package charts/badge-butler --destination .

      - name: Log in to Gitea registry
        run: helm registry login gitea.team5software.de -u "${{ gitea.actor }}" -p "${{ secrets.T5S_PACKAGE_TOKEN }}"

      - name: Push chart to Gitea (required)
        run: helm push "badge-butler-${{ needs.image.outputs.version }}.tgz" oci://gitea.team5software.de/t5s

      - name: Log in to GHCR (best-effort)
        id: ghcr_login
        continue-on-error: true
        run: helm registry login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" -p "${{ secrets.GHCR_TOKEN }}"

      - name: Push chart to GHCR (best-effort)
        id: ghcr_push
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        run: helm push "badge-butler-${{ needs.image.outputs.version }}.tgz" "oci://ghcr.io/${{ secrets.GHCR_USERNAME }}"

      - name: Warn if GHCR chart push failed
        if: steps.ghcr_login.outcome == 'failure' || steps.ghcr_push.outcome == 'failure'
        run: |
          {
            echo "### :warning: GHCR chart push failed"
            echo "Gitea chart push succeeded; ghcr.io did not. Pipeline still passes since Gitea is the required destination."
          } >> "$GITHUB_STEP_SUMMARY"
