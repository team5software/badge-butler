# Push to main (the merged "release: vX.Y.Z" PR): test, push image and chart, create the release.
# Pull requests: build image and chart without pushing; PRs into main also preview the release notes.
#
# Required repo secrets:
#   GITEA_TOKEN            - checkout and creating the Gitea release
#   T5S_PACKAGE_TOKEN      - Gitea token with package:write, for docker/helm login
#   GHCR_TOKEN             - GitHub PAT with write:packages; also used by git-cliff-action, whose
#                            download through the GitHub API rejects Gitea's own token
#   BADGE_BUTLER_API_KEY   - release badge update
#   BADGE_BUTLER_BADGE_KEY - release badge update
#
# Required variable (not a secret, or its value gets masked in logs and summaries):
#   GHCR_USERNAME          - GitHub user/org to push images and charts under
name: Package & Publish
on:
  push:
    branches: [main]
  pull_request:

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
    env:
      BADGEBUTLER_TEST_POSTGRES: Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          fetch-depth: 0

      - name: Determine version
        id: version
        if: gitea.event_name == 'push' || gitea.base_ref == 'main'
        env:
          PR_TITLE: ${{ gitea.event.pull_request.title }}
          HEAD_REF: ${{ gitea.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Releases go from develop into main, not from ${HEAD_REF}."
            exit 1
          fi
          subject="${PR_TITLE:-$(git log -1 --format=%s)}"
          if [[ ! "$subject" =~ release:\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "::error::Expected \"release: vX.Y.Z\" in \"${subject}\"."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} is already released."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: gitea.event_name == 'push'
        uses: actions/setup-dotnet@v6
      - name: Restore
        if: gitea.event_name == 'push'
        run: dotnet restore BadgeButler.slnx
      - name: Wait for Postgres
        if: gitea.event_name == 'push'
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 2
          done
          echo "Postgres service did not come up within 60s" >&2
          exit 1
      - name: Test
        if: gitea.event_name == 'push'
        run: dotnet test BadgeButler.slnx --no-restore -c Release

  docker-image:
    needs: prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Compute image tags
        id: tags
        if: gitea.event_name == 'push'
        run: |
          VERSION="${{ needs.prerequisites.outputs.version }}"
          {
            echo "gitea_tags<<TAGEOF"
            echo "gitea.team5software.de/t5s/badge-butler:${VERSION}"
            echo "gitea.team5software.de/t5s/badge-butler:latest"
            echo "TAGEOF"

            echo "ghcr_tags<<TAGEOF"
            echo "ghcr.io/${{ vars.GHCR_USERNAME }}/badge-butler:${VERSION}"
            echo "ghcr.io/${{ vars.GHCR_USERNAME }}/badge-butler:latest"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        if: gitea.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: gitea.team5software.de
          username: ${{ gitea.actor }}
          password: ${{ secrets.T5S_PACKAGE_TOKEN }}

      - name: Build (and push to Gitea on release)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BadgeButler.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ gitea.event_name == 'push' }}
          provenance: false
          tags: ${{ steps.tags.outputs.gitea_tags }}
          annotations: |
            index:org.opencontainers.image.source=https://gitea.team5software.de/t5s/badge-butler
            index:org.opencontainers.image.description=Stores and serves status badges
            index:org.opencontainers.image.licenses=MIT

      - name: Log in to GHCR (optional)
        id: ghcr_login
        if: gitea.event_name == 'push'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push to GHCR
        if: steps.ghcr_login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BadgeButler.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.ghcr_tags }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/team5software/badge-butler
            index:org.opencontainers.image.description=Stores and serves status badges
            index:org.opencontainers.image.licenses=MIT

      - name: Warn if GHCR login failed
        if: steps.ghcr_login.outcome == 'failure'
        run: |
          {
            echo "### :warning: Could not connect to GHCR (docker-image)"
            echo "Pushing to ghcr.io is optional and this can be intended. If you want to push to ghcr.io, please check your credentials."
          } >> "$GITHUB_STEP_SUMMARY"

  helm-chart:
    needs: [ prerequisites, docker-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prerequisites.outputs.version || '0.0.0-pr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/badge-butler

      - name: Set chart/app version
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" charts/badge-butler/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/badge-butler/Chart.yaml

      - name: Package chart
        run: helm package charts/badge-butler --destination .

      - name: Log in to Gitea registry
        if: gitea.event_name == 'push'
        run: helm registry login gitea.team5software.de -u "${{ gitea.actor }}" -p "${{ secrets.T5S_PACKAGE_TOKEN }}"

      - name: Push chart to Gitea
        if: gitea.event_name == 'push'
        run: helm push "badge-butler-${VERSION}.tgz" oci://gitea.team5software.de/t5s/charts

      - name: Log in to GHCR (optional)
        id: ghcr_login
        if: gitea.event_name == 'push'
        continue-on-error: true
        run: helm registry login ghcr.io -u "${{ vars.GHCR_USERNAME }}" -p "${{ secrets.GHCR_TOKEN }}"

      - name: Re-point chart source to GitHub mirror for GHCR
        if: steps.ghcr_login.outcome == 'success'
        run: |
          sed -i "s|^home: .*|home: https://github.com/team5software/badge-butler|" charts/badge-butler/Chart.yaml
          sed -i "s|^  - https://gitea.team5software.de/t5s/badge-butler|  - https://github.com/team5software/badge-butler|" charts/badge-butler/Chart.yaml
          helm package charts/badge-butler --destination .

      - name: Push chart to GHCR
        if: steps.ghcr_login.outcome == 'success'
        run: helm push "badge-butler-${VERSION}.tgz" "oci://ghcr.io/${{ vars.GHCR_USERNAME }}/charts"

      - name: Warn if GHCR login failed
        if: steps.ghcr_login.outcome == 'failure'
        run: |
          {
            echo "### :warning: Could not connect to GHCR (helm-chart)"
            echo "Pushing to ghcr.io is optional and this can be intended. If you want to push to ghcr.io, please check your credentials."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [ prerequisites, docker-image, helm-chart ]
    if: gitea.event_name == 'push' || gitea.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prerequisites.outputs.version }}
      BRANCH: ${{ gitea.head_ref || gitea.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Find last release
        id: last
        run: echo "tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      # The range has to end in a branch name: git-cliff looks up PRs and authors in that
      # branch's commits on Gitea, and the default branch (main) lacks develop's new ones.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --strip all ${{ steps.last.outputs.tag }}..${{ env.BRANCH }}
          github_token: ${{ secrets.GHCR_TOKEN }}
        env:
          GIT_CLIFF_TAG: v${{ env.VERSION }}
          OUTPUT: release-notes.md

      - name: Show release notes
        run: |
          {
            echo "## v${VERSION}"
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release and tag
        if: gitea.event_name == 'push'
        uses: akkuman/gitea-release-action@v1
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ gitea.sha }}
          body_path: release-notes.md

      - name: Update release badge
        id: badge_update
        if: gitea.event_name == 'push'
        continue-on-error: true
        run: |
          curl -sf -X PUT https://badges.team5software.de/badges/badge-butler-release \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.BADGE_BUTLER_API_KEY }}" \
            -H "X-Badge-Key: ${{ secrets.BADGE_BUTLER_BADGE_KEY }}" \
            -d "{\"label\":\"release\",\"message\":\"v${VERSION}\",\"color\":\"blue\"}"

      - name: Warn if badge update failed
        if: steps.badge_update.outcome == 'failure'
        run: |
          {
            echo "### :warning: Could not update badges"
          } >> "$GITHUB_STEP_SUMMARY"
