name: Build & Test
on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Real Postgres for the PostgresStorage integration tests, started by the runner next to the
    # job container (reachable as "postgres") - the job itself needs no Docker socket.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
    env:
      BADGEBUTLER_TEST_POSTGRES: Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      # Update badges to "in progress"
      - name: Set badges to running
        if: gitea.event_name == 'push'
        continue-on-error: true
        run: |
          for key in badge-butler-build badge-butler-tests; do
            label=${key#badge-butler-}
            curl -sf -X PUT "https://badges.team5software.de/badges/${key}" \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: ${{ secrets.BADGE_BUTLER_API_KEY }}" \
              -H "X-Badge-Key: ${{ secrets.BADGE_BUTLER_BADGE_KEY }}" \
              -d "{\"label\":\"${label}\",\"message\":\"running\",\"color\":\"dfb317\"}"
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore BadgeButler.slnx

      - name: Build
        id: build
        run: dotnet build BadgeButler.slnx --no-restore -c Release

      # Postgres only opens its TCP port once initdb is done and the real server is up.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 2
          done
          echo "Postgres service did not come up within 60s" >&2
          exit 1

      - name: Test
        id: test
        run: >
          dotnet test --no-build -c Release --results-directory ./.artifacts/test-results
          -- --coverlet --coverlet-output-format cobertura --coverlet-output-format opencover --coverlet-include '[BadgeButler.*]*' --report-trx

      - name: Generate coverage report
        id: coverage
        if: steps.test.outcome == 'success'
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:./.artifacts/test-results/**/coverage.*.xml" \
            "-targetdir:./.artifacts/coverage-report" \
            "-reporttypes:Html;Badges;JsonSummary"

      - name: Update build badge
        if: always() && gitea.event_name == 'push'
        continue-on-error: true
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            MESSAGE=passing; COLOR=4c1
          else
            MESSAGE=failing; COLOR=e05d44
          fi
          curl -sf -X PUT https://badges.team5software.de/badges/badge-butler-build \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.BADGE_BUTLER_API_KEY }}" \
            -H "X-Badge-Key: ${{ secrets.BADGE_BUTLER_BADGE_KEY }}" \
            -d "{\"label\":\"build\",\"message\":\"${MESSAGE}\",\"color\":\"${COLOR}\"}"

      - name: Update tests badge
        if: always() && gitea.event_name == 'push'
        continue-on-error: true
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            MESSAGE=passing; COLOR=4c1
          else
            MESSAGE=failing; COLOR=e05d44
          fi
          curl -sf -X PUT https://badges.team5software.de/badges/badge-butler-tests \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.BADGE_BUTLER_API_KEY }}" \
            -H "X-Badge-Key: ${{ secrets.BADGE_BUTLER_BADGE_KEY }}" \
            -d "{\"label\":\"tests\",\"message\":\"${MESSAGE}\",\"color\":\"${COLOR}\"}"

      - name: Update coverage badge
        if: steps.coverage.outcome == 'success' && gitea.event_name == 'push'
        continue-on-error: true
        run: |
          pct=$(grep -oP '"linecoverage":\s*\K[0-9.]+' ./.artifacts/coverage-report/Summary.json)
          if [ -z "$pct" ]; then
            echo "No coverage percentage found in Summary.json, skipping."
            exit 0
          fi
          pct_int=${pct%%.*}
          if [ "$pct_int" -ge 80 ]; then color=4c1
          elif [ "$pct_int" -ge 50 ]; then color=dfb317
          else color=e05d44
          fi
          curl -sf -X PUT https://badges.team5software.de/badges/badge-butler-coverage \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.BADGE_BUTLER_API_KEY }}" \
            -H "X-Badge-Key: ${{ secrets.BADGE_BUTLER_BADGE_KEY }}" \
            -d "{\"label\":\"coverage\",\"message\":\"${pct}%\",\"color\":\"${color}\"}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./.artifacts/test-results/**/*.trx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ./.artifacts/test-results/**/coverage.*.xml
            ./.artifacts/coverage-report
