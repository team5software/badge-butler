{{- $needsDbFallback := not .Values.database.existingSecret.name }}
{{- $needsAuthFallback := and .Values.auth.apiKey (not .Values.auth.existingSecret.name) }}
{{- if or $needsDbFallback $needsAuthFallback }}
# Fallback only, for manual `helm install` testing without pre-provisioned Secrets.
# On GitOps deployments (hl-apps), set database.existingSecret/auth.existingSecret instead —
# never commit database.user/password or auth.apiKey in a values file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "badge-butler.fullname" . }}
  labels:
    {{- include "badge-butler.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsDbFallback }}
  user: {{ .Values.database.user | quote }}
  password: {{ .Values.database.password | quote }}
  {{- end }}
  {{- if $needsAuthFallback }}
  apiKey: {{ .Values.auth.apiKey | quote }}
  {{- end }}
{{- end }}
