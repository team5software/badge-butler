apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "badge-butler.fullname" . }}
  labels:
    {{- include "badge-butler.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "badge-butler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "badge-butler.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "badge-butler.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: badge-butler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGSSLMODE
              value: {{ .Values.database.sslMode | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "badge-butler.secretName" . }}
                  key: {{ .Values.database.existingSecret.userKey | default "user" }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "badge-butler.secretName" . }}
                  key: {{ .Values.database.existingSecret.passwordKey | default "password" }}
            # Composed from the vars above via Kubernetes' $(VAR) expansion, so the password
            # never has to be duplicated into a second literal env value.
            - name: ConnectionStrings__BadgeButler
              value: "Host=$(PGHOST);Port=$(PGPORT);Database=$(PGDATABASE);Username=$(PGUSER);Password=$(PGPASSWORD);SSL Mode=$(PGSSLMODE)"
            # optional: true - if neither auth.existingSecret nor auth.apiKey is set, this secret
            # (or key) simply doesn't exist and the env var is left unset, which the app reads as
            # "no auth configured" (open writes) rather than failing to start.
            - name: Auth__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "badge-butler.authSecretName" . }}
                  key: {{ .Values.auth.existingSecret.key | default "apiKey" }}
                  optional: true
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
